spring.application.name=Atahad

spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Atahad_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
//update

# Error Handling Configuration
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

server.port=8080
spring.thymeleaf.cache=false

# AI (any OpenAI compatible API), the key comes from the environment variable AI_API_KEY
# without a key the app uses ready texts instead of the AI
ai.url=https://api.openai.com/v1/chat/completions
ai.model=gpt-4o-mini
ai.api-key=${AI_API_KEY:}
