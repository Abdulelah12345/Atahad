name: atahad
description: "Atahad - commitment app (frontend)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # navigation between pages
  go_router: ^14.6.2
  # shared state (the logged in user)
  provider: ^6.1.2
  # calls to the backend
  http: ^1.2.2
  # keeps the email and password on the phone (encrypted)
  flutter_secure_storage: ^9.2.2
  # Alexandria and IBM Plex Sans Arabic
  google_fonts: ^6.2.1
  # the riyal symbol and the logo
  flutter_svg: ^2.0.10+1
  # the QR of the group invite
  qr_flutter: ^4.1.0
  # scans the QR of a group invite
  mobile_scanner: ^6.0.2
  # the live camera of the moments (like Locket)
  camera: 0.11.0+2
  # plays the video moments
  video_player: 2.9.2
  # the group alert as a notification with sound (while the app is open)
  flutter_local_notifications: 17.2.4
  # proofs and account
  image_picker: ^1.2.4
  geolocator: ^14.0.2
  # the map of a chosen place (OpenStreetMap tiles, no key)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.3
  health: 13.3.1
  permission_handler: ^12.0.1

# the newest iOS parts of video_player and camera need a newer Xcode, these work with Xcode 16
dependency_overrides:
  video_player_avfoundation: 2.6.5
  camera_avfoundation: 0.9.17+5
  # health -> device_info_plus 12.4.0 uses an iOS 26 API (isiOSAppOnVision) that Xcode 16 does not have
  device_info_plus: 12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # makes the app icon for iOS and Android: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/images/app_icon_square.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # the plugins are built with CocoaPods on iOS (the old versions above do not link with Swift Package Manager)
  config:
    enable-swift-package-manager: false
  assets:
    - assets/icons/
    - assets/images/
    # the design system «أتعهّد»: the logos and the splash videos
    - assets/brand/
    - assets/splash/
